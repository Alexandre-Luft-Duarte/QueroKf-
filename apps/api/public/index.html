<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QueroKafé API</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #faf6f1;
        color: #2b2118;
        font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main { max-width: 34rem; }
      h1 { font-size: 1.5rem; margin: 0 0 .5rem; color: #2b1a12; }
      p { color: #7c6a5c; margin: 0 0 1.5rem; }
      ul { list-style: none; padding: 0; margin: 0; display: grid; gap: .5rem; }
      a {
        display: block;
        padding: .75rem 1rem;
        border: 1px solid #e7d8c9;
        border-radius: .5rem;
        background: #fff;
        color: #6f4e37;
        text-decoration: none;
        font-weight: 600;
      }
      a:hover { border-color: #6f4e37; }
      code { font-family: ui-monospace, monospace; font-size: .875em; }
      @media (prefers-color-scheme: dark) {
        body { background: #1a1410; color: #f5e9da; }
        h1 { color: #f5e9da; }
        a { background: #241b15; border-color: #3a2c22; color: #c68b59; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>☕ QueroKafé API</h1>
      <p>
        API REST do agregador de cafés especiais. Esta é a camada de dados —
        o site fica em outro endereço.
      </p>
      <ul>
        <li><a href="/api/docs">Documentação interativa (Swagger)</a></li>
        <li><a href="/api/health">Health check</a></li>
        <li><a href="/api/coffees">Catálogo de cafés <code>GET /api/coffees</code></a></li>
      </ul>
    </main>
  </body>
</html>
